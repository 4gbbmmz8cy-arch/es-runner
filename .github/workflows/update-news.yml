name: Update daily news feed

on:
  schedule:
    - cron: '20 */2 * * *'
  workflow_dispatch:
    inputs:
      sync_all_d1:
        description: 'Sync all stories to D1 instead of only changed stories'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: feed-refresh
  cancel-in-progress: false

jobs:
  update-feed:
    name: Update Feed
    runs-on: ubuntu-latest
    environment: Prod

    env:
      DISCOVERY_STORY_CONCURRENCY: 1
      URL_RESOLUTION_CONCURRENCY: 1
      PUPPETEER_GLOBAL_CONCURRENCY: 1
      DISCOVERY_STORY_LIMIT: 100
      URL_RESOLUTION_TIMEOUT_MS: 45000
      PAGE_CLOSE_TIMEOUT_MS: 3000
      PUPPETEER_SLOT_TIMEOUT_MS: 30000
      WORKFLOW_HEARTBEAT_MS: 30000
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_MODEL: gpt-5.4-mini
      GEMINI_FALLBACK_MODEL: gemini-3-flash-preview
      GEMINI_THINKING_LEVEL: low
      GEMINI_REQUEST_TIMEOUT_MS: 30000
      GEMINI_MAX_REQUESTS: 12
      AI_EDITORIAL: 1
      AI_EDITORIAL_STORY_LIMIT: 20
      AI_MIN_CONFIDENCE: 0.75
      AI_RETRY_COOLDOWN_HOURS: 6
      AI_CACHE_ROOT: /tmp/es-ai-cache
      FULL_ARTICLE_CACHE_PATH: /tmp/es-full-article-cache.json
      RSS_PROXY_URL: ${{ secrets.RSS_PROXY_URL }}
      RSS_PROXY_TOKEN: ${{ secrets.RSS_PROXY_TOKEN }}
      RSS_PROXY_TIMEOUT_MS: 20000
      PUBLISHER_RSS_CONCURRENCY: 8
      RSS_MAX_BODY_BYTES: 5000000
      RSS_DISCOVERY_WINDOW_HOURS: 6
      FULL_ARTICLE_STORY_CONCURRENCY: 4
      FULL_ARTICLE_FETCH_CONCURRENCY: 10
      FULL_ARTICLE_AI_BATCH_SIZE: 5
      FULL_ARTICLE_STORY_LIMIT: 12
      GEMINI_SUMMARY_ATTEMPTS: 1
      PUPPETEER_BROWSER_ENABLED: 1
      PUPPETEER_NAV_TIMEOUT_MS: 30000
      PUPPETEER_SETTLE_MS: 2500
      OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
      URL_RESOLUTION_VERBOSE: 1

    steps:
      - name: Checkout private ES repository
        uses: actions/checkout@v6
        with:
          repository: clay-36/clay-36.github.io
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Puppeteer
        run: npm install puppeteer --no-save

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Check Puppeteer
        run: |
          node -e "import('puppeteer').then(async ({default:p}) => {
            const b = await p.launch({
              headless:true,
              args:['--no-sandbox','--disable-setuid-sandbox']
            });
            console.log('Chrome launched successfully');
            console.log('Version:', await b.version());
            await b.close();
          })"

      - name: Check Gemini configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
        run: |
          if [ -n "$OPEN_AI_API_KEY" ]; then
            echo "OPEN_AI_API_KEY found"
          else
            echo "OPEN_AI_API_KEY not found; Gemini may be used as backup"
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY found"
          else
            echo "GEMINI_API_KEY not found; using local summaries"
          fi
          echo "Full-article model: $GEMINI_MODEL ($GEMINI_THINKING_LEVEL thinking)"
          echo "Puppeteer resolver: $PUPPETEER_BROWSER_ENABLED"
          echo "Puppeteer timeout: $PUPPETEER_NAV_TIMEOUT_MS ms"

      - name: Update news
        env:
          OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "D1_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          node scripts/update-news.mjs


      - name: Ensure page branding and analytics
        run: |
          node scripts/add-favicon.mjs
          node scripts/add-story-footers.mjs
          node scripts/add-analytics-events.mjs

      - name: Synchronize generated pagination
        run: node scripts/sync-story-pagination.mjs

      - name: Test generated story consistency
        run: |
          node scripts/test-full-article-analysis.mjs || true
          node scripts/test-update-news.mjs || true

      - name: Validate homepage
        run: |
          node --test scripts/test-story-dedup.mjs
          # Duplicate detection is advisory for this feed refresh. Keep the
          # diagnostic output, but let the remaining validation and publish
          # steps run when one probable duplicate is found.
          node scripts/validate-story-duplicates.mjs || echo "::warning::Duplicate-story validation reported probable duplicates; continuing workflow."
          node scripts/validate-homepage.mjs

      - name: Commit generated feed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Update generated feed'
          file_pattern: data/story-data/**/*.json data/stories-index.json data/stories/*.json assets/favicon.svg sitemap.xml robots.txt

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Create D1 schema
        run: |
          npx wrangler d1 execute story-homepage \
            --remote \
            --file=d1/schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # This runs before delta upserts so an empty/new FTS table is rebuilt
      # from all existing stories exactly once.
      - name: Initialize FTS only when empty
        run: |
          npx wrangler d1 execute story-homepage \
            --remote \
            --command="INSERT INTO stories_fts(stories_fts)
                       SELECT 'rebuild'
                       WHERE NOT EXISTS (SELECT 1 FROM stories_fts LIMIT 1);"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate D1 SQL
        shell: bash
        run: |
          if [[ "${{ inputs.sync_all_d1 }}" == "true" ]]; then
            echo "Generating a full D1 sync"
            node scripts/generate-d1-compact-sql.mjs --all
          else
            echo "Generating a D1 delta since $D1_BASE_SHA"
            node scripts/generate-d1-compact-sql.mjs --since "$D1_BASE_SHA"
          fi

      - name: Show generated SQL files
        run: |
          shopt -s nullglob
          files=(generated/stories-*.sql)
          echo "Generated ${#files[@]} D1 chunk(s)"
          ((${#files[@]} == 0)) || ls -lh "${files[@]}"

      - name: Upload changed stories to D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          shopt -s nullglob
          files=(generated/stories-*.sql)

          if ((${#files[@]} == 0)); then
            echo "No story rows changed; skipping D1 writes."
            exit 0
          fi

          echo "Uploading ${#files[@]} changed SQL chunk(s)"
          for file in "${files[@]}"; do
            echo "Importing $file"
            success=false

            for attempt in 1 2 3 4 5; do
              echo "Attempt $attempt/5"
              if npx wrangler d1 execute story-homepage \
                --remote \
                --file="$file"; then
                success=true
                break
              fi

              if [ "$attempt" -lt 5 ]; then
                delay=$((attempt * 10))
                echo "Import failed. Retrying in ${delay}s..."
                sleep "$delay"
              fi
            done

            if [ "$success" != "true" ]; then
              echo "Failed to import: $file"
              exit 1
            fi
          done

      - name: Verify stories table
        run: |
          npx wrangler d1 execute story-homepage \
            --remote \
            --command="SELECT COUNT(*) AS total_stories FROM stories;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify FTS search
        run: |
          npx wrangler d1 execute story-homepage \
            --remote \
            --command="SELECT COUNT(*) AS matching_stories
                       FROM stories_fts
                       WHERE stories_fts MATCH 'India';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
